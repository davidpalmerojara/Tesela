[package]
name = "tesela"
version = "0.1.1"
edition = "2024"
description = "Tesela: an experimental lossy/lossless image format with a Rust encoder and a WebAssembly decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidpalmerojara/Tesela"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
ssimulacra2 = { version = "0.5.1", optional = true }
rayon = { version = "1", optional = true }

[features]
default = ["cli", "encoder"]
# Funciones de codificación del módulo WebAssembly (tsl_header, tsl_encode*,
# tsl_encode_tile). Sin ella queda un módulo que solo decodifica, más pequeño:
# web/tesela-dec.wasm (`--no-default-features`, ver web/build.sh).
encoder = []
parallel = ["dep:rayon"]
metrics = ["dep:ssimulacra2"]
cli = ["dep:image", "metrics", "parallel"]

[profile.release]
debug = false
codegen-units = 1
lto = "thin"

[[bin]]
name = "tesela"
path = "src/main.rs"
required-features = ["cli"]

[lib]
crate-type = ["rlib", "cdylib"]

# Para el fuzzer: optimizado, pero con comprobación de desbordamientos.
[profile.fuzz]
inherits = "release"
overflow-checks = true
debug-assertions = true
